<rect x="1005" y="595" width="325" height="150" rx="16" fill="#fff4f4" stroke="#f4b4b4" stroke-width="2"/>
<text x="1035" y="635" font-family="Arial" font-size="17" font-weight="700" fill="#b42318">SECURITY PLANE</text>
<g font-family="Arial" font-size="15" fill="#7a271a"><text x="1035" y="670">Prompt injection • Indirect injection</text><text x="1035" y="700">RAG poisoning • Data exposure</text><text x="1035" y="730">Unauthorized retrieval • API abuse</text></g>

<rect x="70" y="795" width="1260" height="78" rx="16" fill="#0b2d4d"/>
