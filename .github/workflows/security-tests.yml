name: Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Authorization and retrieval policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt

      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt -r app/requirements.txt

      - name: Run security tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
